name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Package the plugin
        run: |
          mkdir -p dist/github-review
          cp main.js manifest.json styles.css dist/mcp-stdio.js dist/github-review/
          (cd dist && zip -r github-review.zip github-review)

      - name: Create or update the GitHub release with artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          FILES="main.js manifest.json styles.css dist/mcp-stdio.js dist/github-review.zip"
          NOTES="Manual install: copy main.js, manifest.json, styles.css and mcp-stdio.js into <vault>/.obsidian/plugins/github-review/ (or unzip github-review.zip there), then enable the plugin in Community plugins."
          # Idempotent: update the assets if a release for this tag already exists.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" --title "$TAG" --notes "$NOTES" $FILES
          fi
