name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit

      - name: Cache Obsidian downloads
        uses: actions/cache@v4
        with:
          path: .obsidian-cache
          key: obsidian-cache-${{ runner.os }}

      # Obsidian (Electron) needs a display on Linux.
      - name: Set up virtual display
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq herbstluftwm dzen2 x11-xserver-utils
          export DISPLAY=:99
          echo "DISPLAY=$DISPLAY" >> "$GITHUB_ENV"
          Xvfb :99 -screen 0 1280x1024x24 +extension GLX -noreset &
          sleep 1
          herbstluftwm &
          sleep 1

      - name: End-to-end tests (real Obsidian)
        run: npm run test:e2e
        env:
          WDIO_MAX_INSTANCES: 2
